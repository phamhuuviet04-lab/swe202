    <!-- MÀN HÌNH CHÍNH -->
    <div id="quiz-screen" class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-3xl hidden">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div class="text-sm text-white bg-blue-600 px-4 py-2 rounded-lg font-bold shadow-sm" id="progress">Đang tải dữ liệu...</div>
            <div class="text-xs text-gray-400 font-medium">SWE & AI Prep Tool</div>
        </div>
        
        <h2 class="text-xl font-bold mb-6 text-gray-800 leading-relaxed" id="question-text"></h2>
        
        <div id="options-container" class="space-y-3 mb-6"></div>

        <button id="submit-btn" class="w-full bg-gray-900 text-white py-4 rounded-lg font-bold text-lg hover:bg-gray-800 transition shadow-lg">
            Kiểm tra đáp án
        </button>

        <div id="feedback" class="mt-6 p-5 rounded-lg hidden">
            <h3 id="feedback-title" class="font-bold text-lg mb-2"></h3>
            <p id="feedback-text" class="text-base font-semibold opacity-90"></p>
            <button id="next-btn" class="mt-5 w-full bg-blue-600 text-white py-3 rounded-lg font-bold shadow-md hover:bg-blue-700 transition">
                Tiếp tục ➔
            </button>
        </div>
    </div>

    <script>
        let reviewQueue = [];
        let currentQuestion = null;

        const ui = {
            quizScreen: document.getElementById('quiz-screen'),
            progress: document.getElementById('progress'),
            question: document.getElementById('question-text'),
            options: document.getElementById('options-container'),
            submitBtn: document.getElementById('submit-btn'),
            feedback: document.getElementById('feedback'),
            feedbackTitle: document.getElementById('feedback-title'),
            feedbackText: document.getElementById('feedback-text'),
            nextBtn: document.getElementById('next-btn'),
        };

        // --- BẢN FIX: THUẬT TOÁN PARSE CHỐNG LỖI OCR ---
        function parseDatabase() {
            const rawData = document.getElementById('database').textContent;
            const blocks = rawData.split(/Câu \d+/i).filter(b => b.trim());
            const questions = [];

            blocks.forEach(block => {
                // Bỏ qua các câu hỏng
                if (block.includes("OCR lỗi") || block.includes("Đáp án đúng: ?") || block.includes("Đáp án đúng: ?")) return;

                const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                let answerLineIdx = lines.findIndex(l => l.includes('Đáp án đúng:'));
                if (answerLineIdx === -1) return;

                const answerStr = lines[answerLineIdx].split('Đáp án đúng:')[1].trim();
                const correctLetters = answerStr.split(',').map(s => s.trim().toUpperCase());

                // Tìm dòng bắt đầu chứa tùy chọn (A., B., C. hoặc True/False)
                let firstOptionIdx = -1;
                for(let i = answerLineIdx + 1; i < lines.length; i++) {
                    if (/^[A-E]\s*[\.\)]/.test(lines[i]) || lines[i].includes('✓')) {
                        firstOptionIdx = i;
                        break;
                    }
                }

                if (firstOptionIdx === -1) return;

                const questionText = lines.slice(answerLineIdx + 1, firstOptionIdx).join('\n').replace(/✓/g, '').trim();
                
                const options = [];
                const correctOptionsText = [];
                let currentOptionLetter = null;
                let currentOptionText = "";
                let isCorrectIndicator = false;

                for(let i = firstOptionIdx; i < lines.length; i++) {
                    const line = lines[i];
                    const match = line.match(/^([A-E])\s*[\.\)]\s*(.*)/);
                    
                    if (match) {
                        if (currentOptionText) {
                            let cleanOpt = currentOptionText.replace(/✓/g, '').trim();
                            options.push(cleanOpt);
                            
                            // Check điều kiện đúng
                            let isTrueFalseT = correctLetters.includes('T') && cleanOpt.toLowerCase().includes('true');
                            let isTrueFalseF = correctLetters.includes('F') && cleanOpt.toLowerCase().includes('false');
                            if (isCorrectIndicator || (currentOptionLetter && correctLetters.includes(currentOptionLetter)) || isTrueFalseT || isTrueFalseF) {
                                correctOptionsText.push(cleanOpt);
                            }
                        }
                        currentOptionLetter = match[1].toUpperCase();
                        currentOptionText = match[2];
                        isCorrectIndicator = line.includes('✓');
                    } else {
                        currentOptionText += " " + line;
                        if (line.includes('✓')) isCorrectIndicator = true;
                    }
                }
                
                // Đẩy dòng đáp án cuối
                if (currentOptionText) {
                    let cleanOpt = currentOptionText.replace(/✓/g, '').trim();
                    options.push(cleanOpt);
                    
                    let isTrueFalseT = correctLetters.includes('T') && cleanOpt.toLowerCase().includes('true');
                    let isTrueFalseF = correctLetters.includes('F') && cleanOpt.toLowerCase().includes('false');
                    
                    if (isCorrectIndicator || (currentOptionLetter && correctLetters.includes(currentOptionLetter)) || isTrueFalseT || isTrueFalseF) {
                        correctOptionsText.push(cleanOpt);
                    }
                }

                // Chống trùng lặp đáp án đúng
                const uniqueCorrect = [...new Set(correctOptionsText)];

                if (options.length > 1 && uniqueCorrect.length > 0) {
                    questions.push({
                        question: questionText,
                        type: uniqueCorrect.length > 1 ? 'checkbox' : 'radio',
                        options: options,
                        correct: uniqueCorrect,
                        explanation: "Đáp án gốc: " + answerStr
                    });
                }
            });
            return questions;
        }

        // Khởi chạy App ngay lập tức
        window.onload = () => {
            reviewQueue = parseDatabase();
            // Trộn câu hỏi
            reviewQueue = reviewQueue.sort(() => Math.random() - 0.5);
            ui.quizScreen.classList.remove('hidden');
            loadNextQuestion();
        };

        function loadNextQuestion() {
            if (reviewQueue.length === 0) {
                ui.question.innerHTML = "🎉 Tuyệt vời! Bạn đã hoàn thành bài thi SWE.";
                ui.options.innerHTML = "";
                ui.submitBtn.style.display = "none";
                ui.progress.style.display = "none";
                return;
            }

            currentQuestion = reviewQueue[0];
            ui.progress.innerText = `Còn ${reviewQueue.length} câu`;
            ui.question.innerText = currentQuestion.question;
            
            ui.options.innerHTML = "";
            currentQuestion.options.forEach(opt => {
                const label = document.createElement('label');
                label.className = "flex items-start p-4 border rounded-lg cursor-pointer hover:bg-slate-50 transition border-gray-200 shadow-sm";
                
                const inputType = currentQuestion.type;
                const inputClass = inputType === 'radio' ? 'rounded-full' : 'rounded';

                label.innerHTML = `
                    <input type="${inputType}" name="answer" value="${opt.replace(/"/g, '&quot;')}" class="mt-1 mr-3 w-5 h-5 cursor-pointer accent-blue-600 ${inputClass}">
                    <span class="text-gray-700 font-medium">${opt}</span>
                `;
                ui.options.appendChild(label);
            });

            ui.feedback.classList.add('hidden');
            ui.nextBtn.classList.add('hidden');
            ui.submitBtn.classList.remove('hidden');
        }

        ui.submitBtn.onclick = () => {
            const selectedNodes = document.querySelectorAll('input[name="answer"]:checked');
            const selected = Array.from(selectedNodes).map(el => el.value);
            
            if (selected.length === 0) {
                alert("Vui lòng chọn ít nhất 1 đáp án!"); return;
            }

            const isCorrect = selected.length === currentQuestion.correct.length && 
                              selected.every(val => currentQuestion.correct.includes(val));

            ui.submitBtn.classList.add('hidden');
            ui.feedback.classList.remove('hidden');
            ui.nextBtn.classList.remove('hidden');

            // Highlight đáp án user đã chọn
            selectedNodes.forEach(node => {
                node.parentElement.classList.add('ring-2', 'ring-gray-300');
            });

            if (isCorrect) {
                ui.feedback.className = "mt-6 p-5 rounded-lg bg-green-50 text-green-800 border-2 border-green-200";
                ui.feedbackTitle.innerText = "✅ Chính xác!";
                ui.feedbackText.innerHTML = "Tuyệt vời, chuyển sang câu tiếp theo.";
                reviewQueue.shift(); 
            } else {
                ui.feedback.className = "mt-6 p-5 rounded-lg bg-red-50 text-red-800 border-2 border-red-200";
                ui.feedbackTitle.innerText = "❌ Sai rồi! Đáp án đúng là:";
                
                const correctList = currentQuestion.correct.map(c => `• ${c}`).join('<br>');
                ui.feedbackText.innerHTML = `${correctList}`;
                
                const failedItem = reviewQueue.shift();
                reviewQueue.push(failedItem);
            }
        };

        ui.nextBtn.onclick = () => {
            loadNextQuestion();
        };
    </script>
</body>
